<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flow</title>
<style>
  @font-face { font-family: "NS"; src: url("fonts/NotoSans-500.ttf") format("truetype"); font-weight: 500; }
  @font-face { font-family: "NS"; src: url("fonts/NotoSans-700.ttf") format("truetype"); font-weight: 700; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0A0613; }

  /* Every frame is drawn from a number, never from the clock: the renderer
     sets the frame and screenshots, so there is nothing to race. */
  #stage {
    position: relative; width: 1280px; height: 720px; overflow: hidden;
    background: #0A0613;
    font-family: "NS", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* the ground the canvas sits on */
  #dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.085) 1.6px, transparent 1.6px);
    background-size: 32px 32px;
  }
  /* the same light the page carries, at the same strength: loud enough to
     tint the ground, quiet enough that the diagram is the subject */
  .bloom { position: absolute; border-radius: 50%; filter: blur(130px); }
  #bloomA { width: 640px; height: 640px; background: rgba(106,28,176,.15); left: -180px; top: -260px; }
  #bloomB { width: 560px; height: 560px; background: rgba(176,18,82,.13); right: -190px; bottom: -230px; }
  #bloomC { width: 460px; height: 460px; background: rgba(31,70,216,.10); left: 48%; bottom: -280px; }

  #wires { position: absolute; inset: 0; }

  .node {
    position: absolute; width: 264px; height: 74px;
    display: flex; align-items: center; gap: 14px; padding: 0 18px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015)), #14091F;
    border: 1px solid rgba(255,255,255,.13);
    transform-origin: 50% 50%;
  }
  .node .tile {
    flex: 0 0 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(140deg, #FF2E63, #8B31D8);
    display: grid; place-items: center;
  }
  .node .tile svg { width: 21px; height: 21px; fill: none; stroke: #fff; stroke-width: 1.9;
                    stroke-linecap: round; stroke-linejoin: round; }
  .node .label { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: -.01em; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div class="bloom" id="bloomA"></div>
  <div class="bloom" id="bloomB"></div>
  <div class="bloom" id="bloomC"></div>
  <div id="dots"></div>

  <svg id="wires" viewBox="0 0 1280 720">
    <defs>
      <linearGradient id="gWire" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="900" y2="0">
        <stop offset="0" stop-color="#FF2E63"/>
        <stop offset="1" stop-color="#2F6BFF"/>
      </linearGradient>
      <filter id="fGlow" x="-60%" y="-300%" width="220%" height="700%">
        <feGaussianBlur stdDeviation="4"/>
      </filter>
    </defs>
    <g id="wireBase"></g>
    <g id="wireDraw"></g>
    <g id="wireGlow" filter="url(#fGlow)"></g>
    <g id="wirePulse"></g>
  </svg>

  <div class="node" id="n0"><span class="tile"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="M3 6l9 7 9-7"/></svg></span><span class="label">New lead</span></div>
  <div class="node" id="n1"><span class="tile"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></span><span class="label">Read and classify</span></div>
  <div class="node" id="n2"><span class="tile"><svg viewBox="0 0 24 24"><path d="M21 3L10.5 13.5"/><path d="M21 3l-6.8 18-3.7-7.5L3 9.8z"/></svg></span><span class="label">Send reply</span></div>
  <div class="node" id="n3"><span class="tile"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M3 15h18M9 4v16"/></svg></span><span class="label">Add to sheet</span></div>
  <div class="node" id="n4"><span class="tile"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 1 6 6v4l2 3H4l2-3V9a6 6 0 0 1 6-6z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg></span><span class="label">Notify team</span></div>
</div>

<script>
(function () {
  "use strict";

  var FPS = 24, DUR = 8, TOTAL = FPS * DUR;           /* 192 frames */
  var NS = "http://www.w3.org/2000/svg";

  var NODES = [
    { id: "n0", x: 128, cy: 360 },
    { id: "n1", x: 486, cy: 360 },
    { id: "n2", x: 888, cy: 196 },
    { id: "n3", x: 888, cy: 360 },
    { id: "n4", x: 888, cy: 524 }
  ];
  var W = 264, H = 74;

  NODES.forEach(function (n) {
    n.el = document.getElementById(n.id);
    n.el.style.left = n.x + "px";
    n.el.style.top = (n.cy - H / 2) + "px";
  });

  /* a connector leaves the right edge of one node and arrives at the left
     edge of the next, bending only horizontally so the run reads as a wire
     on a board rather than a doodle */
  function wirePath(a, b) {
    var x1 = a.x + W, y1 = a.cy, x2 = b.x, y2 = b.cy;
    var bend = Math.max(46, (x2 - x1) * 0.55);
    return "M " + x1 + " " + y1 +
           " C " + (x1 + bend) + " " + y1 + ", " + (x2 - bend) + " " + y2 + ", " + x2 + " " + y2;
  }

  var LINKS = [
    { from: 0, to: 1 },
    { from: 1, to: 2 },
    { from: 1, to: 3 },
    { from: 1, to: 4 }
  ];

  var gBase = document.getElementById("wireBase");
  var gDraw = document.getElementById("wireDraw");
  var gGlow = document.getElementById("wireGlow");
  var gPulse = document.getElementById("wirePulse");

  LINKS.forEach(function (l) {
    var d = wirePath(NODES[l.from], NODES[l.to]);

    l.base = document.createElementNS(NS, "path");
    l.base.setAttribute("d", d);
    l.base.setAttribute("fill", "none");
    l.base.setAttribute("stroke", "rgba(255,255,255,.10)");
    l.base.setAttribute("stroke-width", "2");
    gBase.appendChild(l.base);

    l.draw = document.createElementNS(NS, "path");
    l.draw.setAttribute("d", d);
    l.draw.setAttribute("fill", "none");
    l.draw.setAttribute("stroke", "url(#gWire)");
    l.draw.setAttribute("stroke-width", "2.4");
    l.draw.setAttribute("stroke-linecap", "round");
    gDraw.appendChild(l.draw);

    l.glow = document.createElementNS(NS, "path");
    l.glow.setAttribute("d", d);
    l.glow.setAttribute("fill", "none");
    l.glow.setAttribute("stroke", "#FF2E63");
    l.glow.setAttribute("stroke-width", "5");
    l.glow.setAttribute("stroke-linecap", "round");
    gGlow.appendChild(l.glow);

    l.pulse = document.createElementNS(NS, "path");
    l.pulse.setAttribute("d", d);
    l.pulse.setAttribute("fill", "none");
    l.pulse.setAttribute("stroke", "#FFC2D4");
    l.pulse.setAttribute("stroke-width", "3.2");
    l.pulse.setAttribute("stroke-linecap", "round");
    gPulse.appendChild(l.pulse);

    l.len = l.draw.getTotalLength();
  });

  /* ---------- timing ---------- */
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function seg(f, a, b) { return clamp((f - a) / (b - a)); }
  function outCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function inOut(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  /* rises to 1 and falls back, for a light that passes through */
  function bump(t) { return t <= 0 || t >= 1 ? 0 : Math.sin(Math.PI * t); }

  /* The cycle ends on the finished board rather than on an empty one, and
     the renderer starts its output inside that resting window - so the loop
     meets itself where nothing is moving, and the poster frame is the whole
     diagram instead of a blank canvas. */
  var T = {
    node:  [[4, 20], [38, 54], [74, 90], [78, 94], [82, 98]],
    wire:  [[20, 38], [54, 74], [58, 78], [62, 82]],
    /* the light leaves the first node, reaches the second, then fans out */
    pulseA: [104, 126],
    pulseB: [126, 148],
    lit:   [104, 126, 148, 148, 148],
    rest:  [162, 176],
    fade:  [176, 190]
  };

  var PULSE_LEN = 58;

  function draw(f) {
    /* one full period across the loop, so the last frame meets the first */
    var ang = 2 * Math.PI * (f / TOTAL);
    document.getElementById("bloomA").style.transform =
      "translate(" + (Math.sin(ang) * 26).toFixed(2) + "px," + (Math.cos(ang) * 18).toFixed(2) + "px)";
    document.getElementById("bloomB").style.transform =
      "translate(" + (Math.cos(ang) * -22).toFixed(2) + "px," + (Math.sin(ang) * 20).toFixed(2) + "px)";
    document.getElementById("bloomC").style.transform =
      "translate(" + (Math.sin(ang + 1.2) * 30).toFixed(2) + "px,0)";

    /* everything built dissolves at the end, and frame zero is bare, so the
       clip meets itself without a cut */
    var out = 1 - seg(f, T.fade[0], T.fade[1]);

    NODES.forEach(function (n, i) {
      var t = outCubic(seg(f, T.node[i][0], T.node[i][1]));
      var glow = bump(seg(f, T.lit[i], T.lit[i] + 14));
      n.el.style.opacity = (t * out).toFixed(3);
      n.el.style.transform = "translateY(" + ((1 - t) * 12).toFixed(2) + "px) scale(" + (0.94 + t * 0.06).toFixed(4) + ")";
      n.el.style.borderColor = "rgba(255," + Math.round(255 - glow * 209) + "," + Math.round(255 - glow * 156) + "," + (0.13 + glow * 0.62).toFixed(3) + ")";
      n.el.style.boxShadow = glow > 0.001
        ? "0 0 " + (34 * glow).toFixed(1) + "px " + (2 * glow).toFixed(1) + "px rgba(255,46,99," + (0.5 * glow).toFixed(3) + ")"
        : "none";
    });

    LINKS.forEach(function (l, i) {
      var t = inOut(seg(f, T.wire[i][0], T.wire[i][1]));
      l.base.style.opacity = (t > 0 ? out : 0).toFixed(3);
      l.draw.style.strokeDasharray = l.len;
      l.draw.style.strokeDashoffset = (l.len * (1 - t)).toFixed(2);
      l.draw.style.opacity = out.toFixed(3);

      /* the light runs the first wire alone, then all three at once */
      var span = i === 0 ? T.pulseA : T.pulseB;
      var p = seg(f, span[0], span[1]);
      var on = p > 0 && p < 1 ? out : 0;
      var head = l.len * p;
      var dash = PULSE_LEN + " " + (l.len + PULSE_LEN);
      var off = (PULSE_LEN - head).toFixed(2);

      l.pulse.style.strokeDasharray = dash;
      l.pulse.style.strokeDashoffset = off;
      l.pulse.style.opacity = on.toFixed(3);
      l.glow.style.strokeDasharray = dash;
      l.glow.style.strokeDashoffset = off;
      l.glow.style.opacity = (on * 0.85).toFixed(3);
    });
  }

  window.TOTAL = TOTAL;
  window.setFrame = function (f) { draw(((f % TOTAL) + TOTAL) % TOTAL); };
  window.setFrame(0);
})();
</script>
</body>
</html>
