<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative;
    background:
      radial-gradient(70% 90% at 88% 6%, rgba(31,70,216,.6) 0%, transparent 62%),
      radial-gradient(65% 85% at 10% 22%, rgba(106,28,176,.62) 0%, transparent 60%),
      radial-gradient(80% 70% at 50% 105%, rgba(176,18,82,.45) 0%, transparent 62%),
      #0A0613;
    color:#fff;font-family:"Noto Sans Hebrew",sans-serif;
    padding:56px 64px;display:flex;flex-direction:column;justify-content:center;gap:30px}
  .top{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px;font-family:"Noto Sans Hebrew",sans-serif}
  .logo{width:44px;height:44px;display:block}
  .brand b{font-weight:700;font-size:1.25rem;display:block;line-height:1.2;color:#fff}
  .brand span{color:#8E85A3;font-size:.92rem}
  .tag{font-family:"Noto Sans Hebrew",sans-serif;font-weight:500;font-size:.95rem;color:#FF7A9E;
    background:rgba(255,46,99,.12);border:1px solid rgba(255,46,99,.34);padding:9px 20px;border-radius:999px}
  h1{font-family:"Noto Sans Hebrew",sans-serif;font-weight:800;font-size:54px;line-height:1.14;letter-spacing:-.02em}
  .mark{position:relative;white-space:nowrap}
  .mark::after{content:"";position:absolute;inset-inline:-3px;bottom:.03em;height:.15em;background:#FF2E63;border-radius:3px;z-index:-1}
  p.sub{font-size:24px;color:#C6BCD8;max-width:40ch}
  .flow{display:flex;align-items:center;gap:9px;font-size:18px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.09);padding:10px 17px;border-radius:999px;white-space:nowrap}
  .pill.ai{background:#E0134E;font-family:"Noto Sans Hebrew",sans-serif;font-weight:700}
  .arw{color:#8E85A3}
</style></head><body>
  <div class="top">
    <div class="brand"><img class="logo" src="../assets/img/logo.svg" alt=""><span><b>Erez Bartal</b><span>AI &amp; Automation</span></span></div>
    <span class="tag">סדנאות AI ואוטומציה לעסקים</span>
  </div>
  <div>
    <h1>עדיין מבזבזים זמן<br>על עבודה ידנית? <span class="mark">בואו נשנה את זה.</span></h1>
    <p class="sub" style="margin-top:18px">סדנה מעשית של 3-4 שעות: מוצאים את התהליך ששווה לטפל בו, מתכננים אותו, ובונים גרסה ראשונה שעובדת. בלי קוד.</p>
  </div>
  <div class="flow">
    <span class="pill">ליד חדש</span><span class="arw">←</span>
    <span class="pill ai">AI · סיווג</span><span class="arw">←</span>
    <span class="pill">CRM</span><span class="arw">←</span>
    <span class="pill">הודעה ללקוח</span><span class="arw">←</span>
    <span class="pill">Follow-up</span>
  </div>
</body></html>
