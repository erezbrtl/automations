<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
:root{--paper:#F7F6F2;--ink:#16181C;--soft:#5A5F63;--rule:#D8D6CC;--accent:#0F5148;--accent-soft:#E1EAE5}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Hebrew",sans-serif;padding:52px 64px;display:flex;flex-direction:column;justify-content:center;gap:34px;overflow:hidden}
.top{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.top .brand{font-size:22px;letter-spacing:-.02em;color:var(--ink);text-transform:none}
.top .brand b{color:var(--accent);font-weight:500}
h1{font-family:"Suez One",serif;font-weight:400;font-size:54px;line-height:1.16;letter-spacing:-.015em;max-width:22ch}
h1 span{color:var(--soft);display:block}
p{margin-top:18px;font-size:22px;color:var(--soft);max-width:34ch;line-height:1.5}
.flow{display:flex;align-items:center;gap:9px;font-size:17px}
.n{border:1px solid var(--rule);border-radius:3px;padding:9px 15px;background:#fff;white-space:nowrap}
.n.ai{border-color:var(--accent);background:var(--accent-soft);font-family:"IBM Plex Mono",monospace;font-weight:500}
.sep{font-family:"IBM Plex Mono",monospace;color:#8A8F93}
.rule{height:1px;background:var(--rule);margin:22px 0}
</style></head><body>
<div class="top"><span class="brand">Erez<b>.</b>B</span><span>AI · Automation · No-Code</span></div>
<div>
  <h1>AI ואוטומציה לעסק.<span>בלי קוד. בלי הייפ. עם תוצאות.</span></h1>
  <p>סדנאות מעשיות לבעלי עסקים ומנהלים.</p>
</div>
<div>
  <div class="rule"></div>
  <div class="flow">
    <span class="n">ליד חדש</span><span class="sep">←</span>
    <span class="n ai">AI · סיווג</span><span class="sep">←</span>
    <span class="n">CRM</span><span class="sep">←</span>
    <span class="n">הודעה ללקוח</span><span class="sep">←</span>
    <span class="n">משימת Follow-up</span>
  </div>
</div>
</body></html>
